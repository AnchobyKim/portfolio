<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="930" viewBox="0 0 1840 930">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d13"/><stop offset="1" stop-color="#111b29"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".35"/></filter></defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="1619.2" cy="93" r="300" fill="#4bd5e7" opacity=".045"/>
  <rect x="60" y="52" width="235" height="34" rx="17" fill="#4bd5e7" fill-opacity=".12" stroke="#4bd5e7" stroke-opacity=".65"/><text x="177.5" y="75" fill="#4bd5e7" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AINVIL-06 / VALIDATION</text><text x="60" y="136" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="46" font-weight="800" text-anchor="start">Passed is not the same as ready to release.</text><text x="60" y="182" fill="#91a0b4" font-family="Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start">AInvil keeps automated evidence, human judgment, and public claims separate.</text>
    <rect x="60" y="250" width="530" height="570" rx="18" fill="#101722" stroke="#263548"/><text x="88" y="290" fill="#91a0b4" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">AUTOMATED BRANCH</text><rect x="100" y="306" width="235" height="34" rx="17" fill="#57e3ad" fill-opacity=".12" stroke="#57e3ad" stroke-opacity=".65"/><text x="217.5" y="329" fill="#57e3ad" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">VALIDATION PASSED</text><text x="100" y="397" fill="#91a0b4" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Compile gate</text><text x="520" y="397" fill="#57e3ad" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="end">Passed</text><text x="100" y="452" fill="#91a0b4" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Play Mode evidence</text><text x="520" y="452" fill="#57e3ad" font-family="Arial, sans-serif" font-size="20" font-weight="800" text-anchor="end">Visual Verified</text><text x="100" y="507" fill="#91a0b4" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Console errors</text><text x="520" y="507" fill="#57e3ad" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="end">0</text><text x="100" y="594" fill="#91a0b4" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">What this proves</text><text x="100" y="632" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">The tested acceptance path passed.</text><text x="100" y="671" fill="#ffbd66" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">It does not authorize a public release.</text>
    <rect x="655" y="250" width="530" height="570" rx="18" fill="#101722" stroke="#263548"/><text x="683" y="290" fill="#91a0b4" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">HUMAN REVIEW BOUNDARY</text><rect x="695" y="306" width="270" height="34" rx="17" fill="#ffbd66" fill-opacity=".12" stroke="#ffbd66" stroke-opacity=".65"/><text x="830" y="329" fill="#ffbd66" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">HUMAN REVIEW REQUIRED</text><text x="695" y="397" fill="#91a0b4" font-family="Consolas, monospace" font-size="18" font-weight="600" text-anchor="start">humanReviewRequired</text><text x="1115" y="397" fill="#ffbd66" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="end">TRUE</text><text x="695" y="452" fill="#91a0b4" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Production Core review</text><text x="1115" y="452" fill="#ff6b74" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="end">Blocked</text><text x="695" y="507" fill="#91a0b4" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Review evidence</text><text x="1115" y="507" fill="#ff6b74" font-family="Arial, sans-serif" font-size="20" font-weight="800" text-anchor="end">Changes Requested</text><text x="695" y="594" fill="#91a0b4" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Required action</text><text x="695" y="632" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Resolve requested changes and perform</text><text x="695" y="666" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">the explicit human release review.</text>
    <rect x="1250" y="250" width="530" height="570" rx="18" fill="#101722" stroke="#263548"/><text x="1278" y="290" fill="#91a0b4" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">PUBLIC RELEASE CLAIM</text><rect x="1290" y="306" width="285" height="34" rx="17" fill="#ff6b74" fill-opacity=".12" stroke="#ff6b74" stroke-opacity=".65"/><text x="1432.5" y="329" fill="#ff6b74" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PUBLIC RELEASE READY: NO</text><text x="1290" y="397" fill="#91a0b4" font-family="Consolas, monospace" font-size="18" font-weight="600" text-anchor="start">publicReleaseReady</text><text x="1710" y="397" fill="#ff6b74" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="end">FALSE</text><text x="1290" y="477" fill="#91a0b4" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Decision logic</text><text x="1290" y="520" fill="#57e3ad" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">automated pass</text><text x="1490" y="520" fill="#91a0b4" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">+</text><text x="1530" y="520" fill="#ffbd66" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">human review</text><text x="1290" y="566" fill="#ff6b74" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">+ release gates</text><text x="1290" y="634" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start">= public claim</text><text x="1290" y="690" fill="#ffbd66" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Current outcome: boundary held.</text>
    <text x="60" y="878" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start">The negative release flag is evidence of governance working—not a failed validation.</text>
  <text x="46" y="902" fill="#91a0b4" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">AInvil • Release boundary • Generated from repository evidence</text>
  </svg>